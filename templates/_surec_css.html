{# Süreç haritası / süreç sayfası ortak stilleri — yalnız tema değişkenleri kullanır (koyu/açık uyumlu) #}
<style>
.sh-wrap{display:flex;flex-direction:column;gap:14px}
.sh-band{border:1px solid var(--border-color);border-radius:12px;background:var(--bg-card);padding:12px 14px}
.sh-band-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sh-band-title i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--text-muted)}
.sh-yon{border-color:var(--cat-yonetim);background:var(--cat-yonetim-bg)}
.sh-yon .sh-band-title i{background:var(--cat-yonetim)}
.sh-ops{border-color:var(--cat-ana)}
.sh-ops .sh-band-title i{background:var(--cat-ana)}
.sh-des{border-color:var(--cat-destek)}
.sh-des .sh-band-title i{background:var(--cat-destek)}
.sh-box{display:flex;flex-direction:column;gap:8px;color:var(--text-primary);border:1px solid var(--border-color);border-radius:10px;padding:12px;background:var(--bg-secondary);min-width:0;transition:border-color .15s,transform .15s;text-decoration:none}
.sh-box:hover{border-color:var(--sh-c,var(--accent-primary))}
.sh-box.ana{--sh-c:var(--cat-ana);border-top:3px solid var(--cat-ana)}
.sh-box.destek{--sh-c:var(--cat-destek);border-top:3px solid var(--cat-destek)}
.sh-box.yonetim{--sh-c:var(--cat-yonetim);border-top:3px solid var(--cat-yonetim)}
.sh-head{display:flex;align-items:flex-start;gap:8px;text-decoration:none;color:inherit}
.sh-kod{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;color:var(--sh-c,var(--text-accent));background:var(--bg-glass);border:1px solid var(--sh-c,var(--border-hover))}
.sh-ad{font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sh-alt{font-size:11.5px;color:var(--text-secondary);line-height:1.5}
.sh-alt a{color:inherit;text-decoration:none;display:flex;justify-content:space-between;gap:6px;padding:1px 0}
.sh-alt a:hover{color:var(--text-primary)}
.sh-alt a span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-alt .n{color:var(--text-muted);flex:none}
.sh-say{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:auto}
.sh-say div{text-align:center;border-radius:6px;background:var(--bg-glass);padding:4px 2px;min-width:0}
.sh-say b{display:block;font-size:14px;line-height:1.2}
.sh-say small{display:block;font-size:9.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-say .z b{color:var(--text-muted);font-weight:500}
.sh-flow .sh-say{grid-template-columns:repeat(2,1fr)}
.sh-meta{font-size:11px;color:var(--text-muted)}
.sh-flow{display:flex;align-items:stretch;gap:0}
.sh-flow .sh-box{flex:1 1 0}
.sh-arr{flex:none;display:flex;align-items:center;justify-content:center;width:30px;color:var(--cat-ana);font-size:20px;font-weight:700}
.sh-io{flex:none;width:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11.5px;font-weight:600;color:var(--text-secondary);border:1px dashed var(--border-hover);border-radius:10px;padding:8px;gap:2px;background:var(--bg-glass)}
.sh-io small{font-weight:400;color:var(--text-muted);font-size:10.5px}
.sh-grid6{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sh-yon-in{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;align-items:start}
.sh-yon-alt{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 10px}
.sh-yon-alt a{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-secondary);text-decoration:none;padding:5px 8px;border-radius:6px;background:var(--bg-glass);min-width:0}
.sh-yon-alt a:hover{color:var(--text-primary)}
.sh-yon-alt a span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-yon-alt .n{color:var(--text-muted);flex:none}
@media (max-width:1100px){
 .sh-flow{flex-direction:column}
 .sh-arr{width:auto;height:26px;transform:rotate(90deg)}
 .sh-io{width:auto;flex-direction:row;justify-content:center;gap:8px}
}
@media (max-width:900px){
 .sh-yon-in{grid-template-columns:1fr}
}
</style>
